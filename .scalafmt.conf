version = 3.8.2
runner.dialect = scala3
# thanks to makescalacurlyagain.com
runner.dialectOverride.allowSignificantIndentation = false
# allows `if x then y`
runner.dialectOverride.allowQuietSyntax = true

# build.sbt / plugins.sbt の縦揃えを維持する。val の = は揃えない
align.tokens."+" = [
  { code = ":=" }
  { code = "%" }
  { code = "%%" }
]

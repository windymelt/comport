name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build in Alpine container
        env:
          COMPORT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build-with-container.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comport-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: comport

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-26-intel
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build native binary
        env:
          COMPORT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comport-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: comport

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # attest-build-provenance signs with an OIDC token and writes the
      # attestation to the repository.
      id-token: write
      attestations: write
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release
          for dir in artifacts/comport-*; do
            name=$(basename "$dir")
            chmod +x "$dir/comport"
            mv "$dir/comport" "release/$name"
          done

      # sha256sum output format, so consumers can verify with
      # `sha256sum --check --ignore-missing checksums.txt`.
      - name: Generate checksums
        run: |
          cd release
          sha256sum comport-* > checksums.txt

      # Proves each binary was produced by this workflow run. Consumers verify
      # with `gh attestation verify <file> --repo windymelt/comport`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/comport-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*

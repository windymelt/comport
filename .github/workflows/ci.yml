name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1
      # scalafmt は非コンパイルで最速に落ち、scalafix は semanticdb 付きの
      # コンパイルを伴うため、その後の compile は追加コストがほぼない。
      # sbtn (thin client) は argv を 1 本の文字列に連結するため引数付きの
      # タスクをクォートで区切れない。`;` 区切りの単一コマンドとして渡す。
      - name: Lint and compile
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck; scalafixAll --check; compile"

  build-linux:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: compile
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build in Alpine container
        run: |
          ./build-with-container.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comport-${{ matrix.target }}
          path: comport

  build-macos:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: compile
    strategy:
      matrix:
        include:
          - os: macos-26-intel
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1

      - name: Build native binary
        run: |
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comport-${{ matrix.target }}
          path: comport

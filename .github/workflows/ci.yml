name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      # scalafmt は非コンパイルで最速に落ち、scalafix は semanticdb 付きの
      # コンパイルを伴うため、その後の compile は追加コストがほぼない。
      # sbtn (thin client) は argv を 1 本の文字列に連結するため引数付きの
      # タスクをクォートで区切れない。`;` 区切りの単一コマンドとして渡す。
      - name: Lint and compile
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck; scalafixAll --check; compile"

  build-linux:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: compile
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in Alpine container
        run: |
          ./build-with-container.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comport-${{ matrix.target }}
          path: comport

  build-macos:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: compile
    strategy:
      matrix:
        include:
          - os: macos-26-intel
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Build native binary
        run: |
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comport-${{ matrix.target }}
          path: comport
